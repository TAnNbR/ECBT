specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: OrderBook
    network: localhost
    source:
      address: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
      abi: OrderBook
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Order
        - OrderFill
        - OrderCancellation
        - User
        - GlobalStats
      abis:
        - name: OrderBook
          file: ./abis/OrderBook.json
      eventHandlers:
        - event: OrderCreated(indexed uint256,indexed address,uint256,uint256)
          handler: handleOrderCreated
        - event: OrderFilled(indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleOrderFilled
        - event: OrderCancelled(indexed uint256,uint256)
          handler: handleOrderCancelled
      file: ./src/mapping.ts

